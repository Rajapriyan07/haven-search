<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven Search</title>
  <script>
    // GitHub Pages SPA redirect
    // This script redirects 404s to index.html with the path preserved
    const path = window.location.pathname;
    const base = '/haven-search';
    if (path.startsWith(base)) {
      const route = path.slice(base.length) || '/';
      sessionStorage.setItem('redirectPath', route);
    }
    window.location.replace('/haven-search/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
