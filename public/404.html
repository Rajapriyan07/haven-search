<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // spa-github-pages redirect
      // Redirects /repo/some/path to /repo/?/some/path
      (function () {
        var l = window.location;
        var repo = "/haven-search";
        var path = l.pathname.startsWith(repo) ? l.pathname.slice(repo.length) : l.pathname;
        var target = repo + "/?" + path + l.search + l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
