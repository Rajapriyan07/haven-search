    <script>
      // If we were redirected from public/404.html (spa-github-pages),
      // restore the original path without reloading.
      (function () {
        var l = window.location;
        if (!l.search.startsWith("?/") || l.search.length <= 2) return;
        var originalPath = decodeURIComponent(l.search.slice(2));
        var newUrl = l.pathname.replace(/\/?$/, "/") + "#"; // temporary anchor to avoid scroll jumps
        window.history.replaceState(null, "", newUrl);
        window.history.replaceState(null, "", l.pathname.replace(/\/?$/, "/") + originalPath + l.hash);
      })();
    </script>
